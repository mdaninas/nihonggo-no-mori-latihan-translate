name: nihongo_no_mori
description: A Japanese reading practice app for JLPT N3 vocabulary.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_logo.png
    - assets/kapizamurai_hero.png
    - assets/kapizamurai_happy.png
    - assets/kapizamurai_zen.png
    - assets/kapizamurai_determined.png
    - assets/kapizamurai_study.png
    - assets/kapizamurai_eat.png
    - assets/kapizamurai_sleep.png
    - assets/section_kanji.png
    - assets/section_spelling.png
    - assets/section_context.png
    - assets/section_synonym.png
    - assets/section_usage.png
